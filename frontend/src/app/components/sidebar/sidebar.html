<aside class="sidebar">
  <div class="sidebar-top">
    <!-- Logo DataGo -->
    <a routerLink="/clientes" class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18"/>
          <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/>
          <path d="M9 9h1"/>
          <path d="M9 13h1"/>
          <path d="M9 17h1"/>
          <path d="M14 9h1"/>
          <path d="M14 13h1"/>
          <path d="M14 17h1"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">DataGo</span>
        <span class="brand-badge">RESIDENCIAL</span>
      </div>
    </a>

    <!-- Menú de Navegación -->
    <nav class="nav-menu">
      <a routerLink="/clientes" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Inicio</span>
      </a>

      <a routerLink="/clientes" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Clientes</span>
      </a>

      <a routerLink="/clientes/nuevo" routerLinkActive="active-btn" class="nav-btn-nuevo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Nuevo cliente</span>
        <span class="status-indicator-dot"></span>
      </a>
    </nav>
  </div>

  <!-- Pie del Sidebar -->
  <div class="sidebar-bottom">
    <a href="#" class="sidebar-help">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>Ayuda & Guías</span>
    </a>

    <div class="system-badge">
      <div class="badge-header">
        <span class="badge-app">DataGo v3.0</span>
        <span class="badge-prod">PROD</span>
      </div>
      <span class="badge-env">Entorno Operativo Seguro</span>
    </div>
  </div>
</aside>
